name: Deploy Nexus to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: nexus-cluster
  TF_VERSION: 1.7.0

jobs:

  # ── Job 1: Terraform ──────────────────────────────────
  terraform:
    name: Provision AWS Infrastructure
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  # ── Job 2: Install ArgoCD ─────────────────────────────
  install-argocd:
    name: Install ArgoCD
    runs-on: self-hosted
    needs: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}

      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl wait --for=condition=Ready pods \
            --all -n argocd --timeout=300s

      - name: Add GitHub repo to ArgoCD
        run: |
          # Install ArgoCD CLI
          curl -sSL -o /tmp/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /tmp/argocd
          sudo mv /tmp/argocd /usr/local/bin/argocd

          # Port forward in background
          kubectl port-forward svc/argocd-server \
            -n argocd 8080:443 &
          sleep 10

          # Get password
          ARGOCD_PASS=$(kubectl get secret argocd-initial-admin-secret \
            -n argocd \
            -o jsonpath="{.data.password}" | base64 -d)

          # Login
          argocd login localhost:8080 \
            --username admin \
            --password $ARGOCD_PASS \
            --insecure

          # Add repo
          argocd repo add \
            https://github.developer.allianz.io/xavier-james1/nexus-deploy-cicd \
            --username xavier-james1 \
            --password ${{ secrets.GHE_PAT }}

  # ── Job 3: Deploy Nexus ───────────────────────────────
  deploy-nexus:
    name: Deploy Nexus
    runs-on: self-hosted
    needs: install-argocd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}

      - name: Apply ArgoCD application
        run: |
          kubectl apply -f k8s/argocd-app.yaml

      - name: Wait for Nexus to be ready
        run: |
          kubectl wait --for=condition=Ready pods \
            --all -n nexus-test --timeout=600s
